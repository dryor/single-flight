<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    sessionStorage.setItem(
      'redirect',
      window.location.pathname +
      window.location.search +
      window.location.hash
    );
    window.location.replace('/single-flight/');
  </script>
</head>

</html>
